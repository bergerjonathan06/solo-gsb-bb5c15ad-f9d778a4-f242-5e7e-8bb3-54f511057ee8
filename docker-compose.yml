services:
  oral-history:
    build: .
    image: oral-history-check:latest
    container_name: oral-history-check
    ports:
      # 宿主机端口:容器端口。页面固定由容器 8080 提供；
      # 如宿主机 8080 被占用，可把冒号左侧改成其它端口，如 "8081:8080"。
      - "${HOST_PORT:-8080}:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/healthz').status==200 else 1)"]
      interval: 15s
      timeout: 3s
      retries: 3
